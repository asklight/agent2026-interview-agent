server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: interview-agent-server
  profiles:
    active: dev
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    encoding: UTF-8

training-agent:
  enabled: ${TRAINING_AGENT_ENABLED:true}
  max-source-sync: ${TRAINING_AGENT_MAX_SOURCE_SYNC:10}
  recovery:
    batch-size: ${TRAINING_AGENT_RECOVERY_BATCH_SIZE:100}
    delay-ms: ${TRAINING_AGENT_RECOVERY_DELAY_MS:60000}
    initial-delay-ms: ${TRAINING_AGENT_RECOVERY_INITIAL_DELAY_MS:15000}

logging:
  level:
    com.agent2026.interview: info

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never

rag-toolkit:
  enabled: ${RAG_TOOLKIT_ENABLED:false}
  base-url: ${RAG_TOOLKIT_BASE_URL:http://127.0.0.1:8100}
  profile: ${RAG_TOOLKIT_PROFILE:interview}
  search-token: ${RAG_SEARCH_TOKEN:}
  connect-timeout: ${RAG_TOOLKIT_CONNECT_TIMEOUT:2s}
  read-timeout: ${RAG_TOOLKIT_READ_TIMEOUT:5s}
  top-k: ${RAG_TOOLKIT_TOP_K:5}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-before-production-32-bytes}
    issuer: ${JWT_ISSUER:agent2026-interview-agent}
    audience: ${JWT_AUDIENCE:agent2026-web}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    refresh-cookie-secure: ${JWT_COOKIE_SECURE:false}
    allowed-origin: ${WEB_ORIGIN:http://localhost:5173}
  rate-limit:
    enabled: true
    requests-per-window: 30
    window: 1m
    max-tracked-clients: 10000
